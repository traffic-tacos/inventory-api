apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  labels:
    app: inventory-api
spec:
  selector:
    app: inventory-api
  ports:
    - name: http
      port: 80
      targetPort: http        # 8020
    - name: health
      port: 8021
      targetPort: health      # 8021
  type: ClusterIP
